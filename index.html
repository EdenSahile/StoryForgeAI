<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Police d'icônes sous-ensemblée (icon_names) : le site n'utilise que 38
      glyphes fixes et une seule graisse (wght 400 partout, seul FILL varie
      0↔1 pour l'état actif de la nav). La version complète (plage 100..700,
      tous les glyphes) transférait ~1,1 Mo ; ce sous-ensemble ~6,8 Ko.
      Ajouter tout nouveau glyphe à la liste icon_names sinon il s'affichera
      en carré vide. Liste tenue à jour par grep exhaustif (cf. commit).
      Piège : le sous-ensemble ne contient QUE la ligature minuscule ; un
      span d'icône sous un parent text-transform: uppercase doit forcer
      text-transform: none (le reset global le fait déjà pour class="icon"
      et .material-symbols-outlined ; les autres classes d'icône doivent le
      déclarer — cf. .spin-icon dans Forge.jsx).
    -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,400&icon_names=add,arrow_back,article,auto_awesome,auto_stories,bolt,bookmark,check_circle,chevron_right,cloud_off,cloud_upload,content_copy,dark_mode,dashboard,delete,delete_sweep,description,done,download,edit,edit_note,expand_more,folder_open,folder_zip,history,info,insert_drive_file,light_mode,palette,picture_as_pdf,restart_alt,schedule,search,settings,storage,sync,sync_saved_locally,view_kanban&display=swap" rel="stylesheet" />
    <meta name="description" content="StoryPilot AI - Générateur de user stories avec Claude API et streaming en temps réel" />
    <meta name="theme-color" content="#f4f6f4" />
    <title>StoryPilot AI</title>
    <!--
      Applique data-theme sur <html> avant le premier rendu React, pour que
      la préférence sauvegardée (clé synchronisée avec THEME_STORAGE_KEY de
      src/logic/themeStorage.js) soit visible dès la première image — sinon
      un useEffect post-montage laisserait voir un flash du thème sombre par
      défaut avant de basculer vers le thème clair sauvegardé.
    -->
    <script>
      (function () {
        var theme = localStorage.getItem("storypilot-theme") || "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { max-width: 100vw; overflow-x: hidden; }
      /* Duplique les fonds de src/App.jsx (--color-background) pour le tout
         premier paint, avant que styled-components n'injecte le GlobalStyle. */
      body { background: #0d1210; min-height: 100dvh; max-width: 100vw; overflow-x: hidden; }
      [data-theme="light"] body { background: #f4f6f4; }
      #root { width: 100%; max-width: 100vw; min-height: 100dvh; overflow-x: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
